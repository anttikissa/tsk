name: Publish to npm

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest # npm trusted publishing requires a GitHub-hosted runner
    permissions:
      contents: read
      id-token: write # npm exchanges GitHub's OIDC token for a short-lived publish credential
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
      - name: Check release tag and package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo 'Expected a vMAJOR.MINOR.PATCH release tag (optional prerelease suffix)' >&2
            exit 1
          fi
          package_version=$(node -p 'require("./package.json").version')
          if [[ "$RELEASE_TAG" != "v$package_version" ]]; then
            echo "Tag $RELEASE_TAG does not match package version $package_version" >&2
            exit 1
          fi
      - name: Install and verify
        run: |
          bun install --frozen-lockfile
          bun test
          bun run typecheck
      - name: Publish with npm trusted publishing
        run: |
          npm install --global npm@11.9.0
          npm publish --access public
